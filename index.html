<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"></div>
  <div class="top-nav">
    <button class="nav-btn" data-mode="accueil">Accueil</button>
    <button class="nav-btn" data-mode="anime">ListeAnimes</button>
    <button class="nav-btn" data-mode="waifu">ListeWaifus</button>
  </div>

  <div id="page-accueil" class="page active">
    <div class="login-wrapper">
      <label for="pseudo">Pseudo</label>
      <input id="pseudo" type="text">
      <label for="mdp">MDP</label>
      <input id="mdp" type="password">
      <div class="buttons">
        <button onclick="connexion()">Se connecter</button>
        <button onclick="inscription()">Créer un compte</button>
      </div>
      <p id="message-login"></p>
    </div>
  </div>

  <div id="page-anime" class="page">
    <div class="stats-line">
      Terminé <span id="count-termine">0</span>
      En Cours <span id="count-en-cours">0</span>
      En Pause <span id="count-en-pause">0</span>
      A Regarder <span id="count-a-regarder">0</span>
      Abandon <span id="count-abandon">0</span>
      Plus Jamais <span id="count-plus-jamais">0</span>
    </div>

    <div class="search-line">
      <input type="text" placeholder="Rechercher...">
      <select>
        <option>Trier par nom</option>
        <option>A → Z</option>
        <option>Z → A</option>
      </select>
      <select>
        <option>Trier par type</option>
        <option>Anime</option>
        <option>Film</option>
      </select>
      <select>
        <option>Trier par statut</option>
        <option>Terminé</option>
        <option>En Cours</option>
      </select>
      <select>
        <option>Trier par note</option>
        <option>1 → 10</option>
        <option>10 → 1</option>
      </select>
    </div>

    <div class="anime-content">
      <div class="anime-sidebar">
        <form id="form-ajout-anime">
          <label>Ajout Nom</label>
          <input id="nom-anime" type="text">
          <label>Type</label>
          <select id="type-anime">
            <option>Choisir</option>
            <option>Anime</option>
            <option>Film</option>
          </select>
          <label>Statut</label>
          <select id="statut-anime">
            <option>Choisir</option>
            <option>Terminé</option>
            <option>En Cours</option>
            <option>En Pause</option>
            <option>A Regarder</option>
            <option>Abandon</option>
            <option>Plus Jamais</option>
          </select>
          <label>Note</label>
          <input id="note-anime" type="text" placeholder="ex. 9.5 ou NA">
          <label>URL Cover</label>
          <input id="poster-anime" type="text">
          <label class="sous-menu-label"><input type="checkbox"> Sous-menu</label>
          <button type="submit">Ajouter</button>
        </form>
        <button id="export-animes">Exporter JSON</button>
        <input type="file" id="import-animes" accept=".json">
        <button onclick="importJSON('animes')">Importer JSON</button>
      </div>

      <div id="anime-grid"></div>
    </div>
  </div>

  <div id="page-waifu" class="page">
    <div class="stats-line">
      Terminé <span id="count-waifu-termine">0</span>
      En Cours <span id="count-waifu-en-cours">0</span>
      En Pause <span id="count-waifu-en-pause">0</span>
      A Regarder <span id="count-waifu-a-regarder">0</span>
      Abandon <span id="count-waifu-abandon">0</span>
      Plus Jamais <span id="count-waifu-plus-jamais">0</span>
    </div>

    <div class="search-line">
      <input type="text" placeholder="Rechercher...">
      <select>
        <option>Trier par nom</option>
        <option>A → Z</option>
        <option>Z → A</option>
      </select>
      <select>
        <option>Trier par type</option>
        <option>Anime</option>
        <option>Film</option>
      </select>
      <select>
        <option>Trier par statut</option>
        <option>Terminé</option>
        <option>En Cours</option>
      </select>
      <select>
        <option>Trier par note</option>
        <option>1 → 10</option>
        <option>10 → 1</option>
      </select>
    </div>

    <div class="anime-content">
      <div class="anime-sidebar">
        <form id="form-ajout-waifu">
          <label>Ajout Nom</label>
          <input id="nom-waifu" type="text">
          <label>Type</label>
          <select id="type-waifu">
            <option>Choisir</option>
            <option>Anime</option>
            <option>Film</option>
          </select>
          <label>Statut</label>
          <select id="statut-waifu">
            <option>Choisir</option>
            <option>Terminé</option>
            <option>En Cours</option>
            <option>En Pause</option>
            <option>A Regarder</option>
            <option>Abandon</option>
            <option>Plus Jamais</option>
          </select>
          <label>Note</label>
          <input id="note-waifu" type="text" placeholder="ex. 9.5 ou NA">
          <label>URL Cover</label>
          <input id="poster-waifu" type="text">
          <label class="sous-menu-label"><input type="checkbox"> Sous-menu</label>
          <button type="submit">Ajouter</button>
        </form>
        <button id="export-waifus">Exporter JSON</button>
        <input type="file" id="import-waifus" accept=".json">
        <button onclick="importJSON('waifus')">Importer JSON</button>
      </div>

      <div id="waifu-grid"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/anime-form.js"></script>
  <script src="js/waifu-form.js"></script> 
</body>
</html>
