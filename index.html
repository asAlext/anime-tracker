<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Tracker Anime & Waifu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"></div>

  <nav class="top-nav">
    <button class="nav-btn active">Accueil</button>
    <button class="nav-btn">ListeAnimes</button>
    <button class="nav-btn">ListeWaifus</button>
  </nav>

  <div id="main-content">
    <div id="page-accueil" class="page active">
      <div class="login-container">
        <div class="login-box">
          <h2>Connexion</h2>
          <input type="text" id="pseudo" placeholder="Pseudo" required>
          <input type="password" id="mdp" placeholder="Mot de passe" required>
          <div class="buttons">
            <button onclick="connexion()">Se connecter</button>
            <button onclick="inscription()">Créer un compte</button>
          </div>
          <p id="message-login" class="message"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
