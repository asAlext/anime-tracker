<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Tracker Anime & Waifu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"></div>
  <!-- Ligne 0 : barre complète en haut -->
  <nav class="top-nav">
    <button class="nav-btn" data-mode="accueil">Accueil</button>
    <button class="nav-btn" data-mode="anime">ListeAnimes</button>
    <button class="nav-btn" data-mode="waifu">ListeWaifus</button>
  </nav>
  <div id="main-content">
    <!-- Page Accueil – JSON centrés milieu -->
    <div id="page-accueil" class="page active">
      <div class="json-section">
        <div class="json-group">
          <h3>Animes</h3>
          <button onclick="exportJSON('animes')">Exporter Animes JSON</button>
          <input type="file" id="import-animes" accept=".json">
          <button onclick="importJSON('animes')">Importer Animes JSON</button>
        </div>
        <div class="json-group">
          <h3>Waifus</h3>
          <button onclick="exportJSON('waifus')">Exporter Waifus JSON</button>
          <input type="file" id="import-waifus" accept=".json">
          <button onclick="importJSON('waifus')">Importer Waifus JSON</button>
        </div>
      </div>
    </div>
    <!-- Page ListeAnimes -->
    <div id="page-anime" class="page" style="display: none;">
      <!-- Ligne 1 : Compteurs -->
      <div class="stats-line">
        <div class="stat-box">
          <span class="stat-label">Terminé</span>
          <span class="stat-count" id="count-termine">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">En Cours</span>
          <span class="stat-count" id="count-en-cours">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">En Pause</span>
          <span class="stat-count" id="count-en-pause">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">A Regarder</span>
          <span class="stat-count" id="count-a-regarder">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Abandon</span>
          <span class="stat-count" id="count-abandon">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Plus Jamais</span>
          <span class="stat-count" id="count-plus-jamais">0</span>
        </div>
      </div>
      <!-- Ligne 2 : Recherche & tris -->
      <div class="search-line">
        <input type="text" id="recherche" placeholder="Rechercher...">
        <select id="trie-nom">
          <option value="">Trier par nom</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
        <select id="trie-type">
          <option value="">Trier par type</option>
          <option value="anime">Anime</option>
          <option value="film">Film</option>
        </select>
        <select id="trie-statut">
          <option value="">Trier par statut</option>
          <option value="termine">Terminé</option>
          <option value="en-cours">En Cours</option>
          <option value="en-pause">En Pause</option>
          <option value="a-regarder">A Regarder</option>
          <option value="abandon">Abandon</option>
          <option value="plus-jamais">Plus Jamais</option>
        </select>
        <select id="trie-note">
          <option value="">Trier par note</option>
          <option value="asc">1 → 10</option>
          <option value="desc">10 → 1</option>
        </select>
      </div>
      <div class="anime-content">
        <div class="anime-sidebar">
          <h3>Ajout</h3>
          <form id="form-ajout-anime">
            <label>Nom</label>
            <input type="text" id="nom-anime" required>
            <label>Type</label>
            <select id="type-anime" required>
              <option value="">Choisir</option>
              <option value="anime">Anime</option>
              <option value="film">Film</option>
            </select>
            <label>Statut</label>
            <select id="statut-anime" required>
              <option value="">Choisir</option>
              <option value="termine">Terminé</option>
              <option value="en-cours">En Cours</option>
              <option value="en-pause">En Pause</option>
              <option value="a-regarder">A Regarder</option>
              <option value="abandon">Abandon</option>
              <option value="plus-jamais">Plus Jamais</option>
            </select>
            <label>Note (ex: 9.5 ou NA)</label>
            <input type="text" id="note-anime">
            <label>URL Cover</label>
            <input type="text" id="poster-anime">
            <label>
              <input type="checkbox" id="sous-menu-anime"> Sous-menu
            </label>
            <button type="submit">Ajouter</button>
          </form>
        </div>
        <div class="anime-grid" id="anime-grid">
          <!-- cartes -->
        </div>
      </div>
    </div>
    <!-- Page ListeWaifus -->
    <div id="page-waifu" class="page" style="display: none;">
      <!-- Ligne 1 : Recherche -->
      <div class="search-line">
        <input type="text" id="recherche-waifu" placeholder="Rechercher...">
        <select id="trie-nom-waifu">
          <option value="">Trier par nom</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
        <select id="trie-note-waifu">
          <option value="">Trier par note</option>
          <option value="asc">1 → 10</option>
          <option value="desc">10 → 1</option>
        </select>
      </div>
      <div class="anime-content">
        <div class="anime-sidebar">
          <h3>Ajout</h3>
          <form id="form-ajout-waifu">
            <label>Nom</label>
            <input type="text" id="nom-waifu" required>
            <label>Note (ex: 9.5 ou NA)</label>
            <input type="text" id="note-waifu">
            <label>URL Cover</label>
            <input type="text" id="poster-waifu">
            <label>Anime Associé</label>
            <input type="text" id="anime-associe-waifu">
            <button type="submit">Ajouter</button>
          </form>
        </div>
        <div class="anime-grid" id="waifu-grid">
          <!-- cartes -->
        </div>
      </div>
    </div>
    <!-- Page Détail -->
    <div id="page-detail" class="page" style="display: none;">
      <div class="detail-content">
        <div class="detail-left">
          <img id="detail-cover-anime" src="" alt="Cover Anime">
          <h2 id="detail-nom-anime"></h2>
          <p id="detail-type-anime"></p>
          <p id="detail-statut-anime"></p>
          <p id="detail-note-anime"></p>
        </div>
        <div class="detail-right">
          <img id="detail-cover-waifu" src="" alt="Cover Waifu">
          <p id="detail-nom-waifu"></p>
          <p id="detail-note-waifu"></p>
        </div>
        <div class="detail-buttons">
          <button id="btn-modifier">Modifier</button>
          <button id="btn-supprimer-anime">Supprimer Anime</button>
          <button id="btn-supprimer-waifu">Supprimer Waifu</button>
        </div>
    <!-- ====================== NOUVELLE PAGE INFOS ====================== -->
    <div id="page-infos" class="page" style="display: none;">
      <div class="detail-content">
        <div class="detail-left">
          <img id="infos-cover-anime" src="" alt="Cover Anime" style="width:420px; height:590px; object-fit:cover;">
        </div>

        <!-- Zone où apparaîtront les titres, lignes et séparateurs -->
        <div id="infos-content" style="margin-top:30px; padding:20px; background:#f9f9f9; border:1px solid #ddd; border-radius:8px; min-height:300px;">
          <!-- Le contenu sera ajouté ici par le script -->
        </div>

        <!-- Boutons en bas -->
        <div class="detail-buttons">
          <button id="btn-retour-detail">Retour</button>
          <button id="btn-ajout-titre">Titre</button>
          <button id="btn-ajout-ligne">+1</button>
          <button id="btn-separateur">Séparateur</button>
        </div>
      </div>
    </div>
  </div>   <!-- ← FERMETURE DE #main-content (inchangée) -->

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/anime-form.js"></script>
  <script src="js/waifu-form.js"></script>
  <script src="js/detail-page.js"></script>

  <!-- Scripts inline pour updateStats + JSON import/export -->
  <script>
    // Fonction qui met à jour tous les compteurs – NORMALISATION IDENTIQUE partout
    function updateStats() {
      const animes = JSON.parse(localStorage.getItem('animes') || '[]');
      const counts = {
        termine: 0,
        'en-cours': 0,
        'en-pause': 0,
        'a-regarder': 0,
        abandon: 0,
        'plus-jamais': 0
      };

      animes.forEach(anime => {
        let statut = (anime.statut || '').toLowerCase().trim();
        statut = statut.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); // supprime accents (é → e)
        statut = statut.replace(/\s+/g, '-'); // espaces → tiret

        if (statut === 'termine') counts.termine++;
        else if (statut === 'en-cours') counts['en-cours']++;
        else if (statut === 'en-pause') counts['en-pause']++;
        else if (statut === 'a-regarder') counts['a-regarder']++;
        else if (statut === 'abandon') counts.abandon++;
        else if (statut === 'plus-jamais') counts['plus-jamais']++;
      });

      document.getElementById('count-termine').textContent = counts.termine;
      document.getElementById('count-en-cours').textContent = counts['en-cours'];
      document.getElementById('count-en-pause').textContent = counts['en-pause'];
      document.getElementById('count-a-regarder').textContent = counts['a-regarder'];
      document.getElementById('count-abandon').textContent = counts.abandon;
      document.getElementById('count-plus-jamais').textContent = counts['plus-jamais'];
    }

    // Appelle au chargement initial
    window.addEventListener('load', updateStats);

    // Exporter JSON
    function exportJSON(type) {
      const data = JSON.parse(localStorage.getItem(type) || '[]');
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${type}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Importer JSON
    function importJSON(type) {
      const input = document.getElementById(`import-${type}`);
      if (input.files.length === 0) {
        alert('Sélectionne un fichier JSON d’abord !');
        return;
      }
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          localStorage.setItem(type, JSON.stringify(data));
          alert(`${type.charAt(0).toUpperCase() + type.slice(1)} importés avec succès !`);
          if (type === 'animes' && document.getElementById('page-anime').style.display === 'block') {
            if (typeof loadAnimes === 'function') loadAnimes();
          }
          if (type === 'waifus' && document.getElementById('page-waifu').style.display === 'block') {
            if (typeof loadWaifus === 'function') loadWaifus();
          }
          updateStats(); // Met à jour les compteurs après import
        } catch (err) {
          alert('Erreur : le fichier JSON est invalide.');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
