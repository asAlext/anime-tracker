<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Tracker Anime & Waifu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fond d'écran fixe -->
  <div class="background"></div>

  <!-- Barre de navigation fixe en haut à droite -->
  <nav class="top-nav">
    <button class="nav-btn active">Accueil</button>
    <button class="nav-btn">ListeAnimes</button>
    <button class="nav-btn">ListeWaifus</button>
  </nav>

  <!-- Formulaire login centré au milieu -->
  <div class="login-container">
    <div class="login-box">
      <h2>Connexion</h2>
      <input type="text" id="pseudo" placeholder="Pseudo" required>
      <input type="password" id="mdp" placeholder="Mot de passe" required>
      
      <div class="buttons">
        <button onclick="connexion()">Se connecter</button>
        <button onclick="inscription()">Créer un compte</button>
      </div>
      
      <p id="message-login" class="message"></p>
    </div>
  </div>

  <!-- Les autres pages seront ajoutées ici plus tard -->
  <div id="content-anime" style="display:none;"></div>
  <div id="content-waifu" style="display:none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
