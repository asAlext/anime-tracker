<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Tracker Anime & Waifu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fond d'écran fixe -->
  <div class="background"></div>

  <!-- Barre de navigation fixe en haut à droite -->
  <nav class="top-nav">
    <button class="nav-btn active" data-mode="accueil">Accueil</button>
    <button class="nav-btn" data-mode="anime">ListeAnimes</button>
    <button class="nav-btn" data-mode="waifu">ListeWaifus</button>
  </nav>

  <!-- Contenu principal -->
  <div id="main-content">
    <!-- Page Accueil : Formulaire login centré -->
    <div id="page-accueil" class="page active">
      <div class="login-container">
        <div class="login-box">
          <h2>Connexion</h2>
          <input type="text" id="pseudo" placeholder="Pseudo" required autocomplete="username">
          <input type="password" id="mdp" placeholder="Mot de passe" required autocomplete="current-password">
          
          <div class="buttons">
            <button onclick="connexion()">Se connecter</button>
            <button onclick="inscription()">Créer un compte</button>
          </div>
          
          <p id="message-login" class="message"></p>
        </div>
      </div>
    </div>

    <!-- Placeholder pour les autres pages (on les ajoutera plus tard) -->
    <div id="page-anime" class="page" style="display:none;">
      <!-- ListeAnimes viendra ici -->
    </div>

    <div id="page-waifu" class="page" style="display:none;">
      <!-- ListeWaifus viendra ici -->
    </div>
  </div>

  <!-- Scripts (on ajoutera les JS un par un) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <!-- Les scripts JS seront ajoutés ici progressivement -->
</body>
</html>
