<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Tracker Anime & Waifu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"></div>
  <nav class="top-nav">
    <button class="nav-btn active" data-mode="accueil">Accueil</button>
    <button class="nav-btn" data-mode="anime">ListeAnimes</button>
    <button class="nav-btn" data-mode="waifu">ListeWaifus</button>
  </nav>

  <div id="main-content">
    <!-- Page Accueil : login (visible avant connexion) -->
    <div id="page-accueil" class="page active">
      <div class="login-container">
        <div class="login-box">
          <h2>Connexion</h2>
          <input type="text" id="pseudo" placeholder="Pseudo ou email" required>
          <input type="password" id="mdp" placeholder="Mot de passe" required>
          <div class="buttons">
            <button onclick="connexion()">Se connecter</button>
            <button onclick="inscription()">Créer un compte</button>
          </div>
          <p id="message-login" class="message"></p>
        </div>
      </div>
    </div>

    <!-- Page ListeAnimes -->
    <div id="page-anime" class="page" style="display: none;">
      <div class="anime-container">
        <div class="anime-sidebar">
          <h3>Ajouter un anime</h3>
          <form id="form-ajout-anime">
            <input type="text" id="nom-anime" placeholder="Nom de l'anime" required>
            <input type="text" id="poster-anime" placeholder="URL de la cover (optionnel)">
            <select id="type-anime" required>
              <option value="">Type</option>
              <option value="TV">TV</option>
              <option value="Film">Film</option>
              <option value="OVA">OVA</option>
              <option value="ONA">ONA</option>
              <option value="Spécial">Spécial</option>
            </select>
            <select id="statut-anime" required>
              <option value="">Statut</option>
              <option value="fini">Fini</option>
              <option value="en cours">En cours</option>
              <option value="en pause">En pause</option>
              <option value="a regarder">À regarder</option>
              <option value="abandon">Abandon</option>
            </select>
            <input type="text" id="note-anime" placeholder="Note (0-10 ou NA)">
            <label>
              <input type="checkbox" id="sous-menu-anime"> Activer sous-menu
            </label>
            <button type="submit">Ajouter</button>
          </form>
        </div>
        <div class="anime-grid" id="anime-grid">
          <!-- Les cartes animes seront ajoutées ici -->
        </div>
      </div>
    </div>

    <!-- Page ListeWaifus -->
    <div id="page-waifu" class="page" style="display: none;">
      <div class="waifu-container">
        <!-- Sidebar ajout -->
        <div class="waifu-sidebar">
          <h3>Ajouter une waifu</h3>
          <form id="form-ajout-waifu">
            <input type="text" id="nom-waifu" placeholder="Nom (facultatif)">
            <input type="text" id="poster-waifu" placeholder="URL de la photo" required>
            <button type="submit">Ajouter</button>
          </form>
        </div>

        <!-- Grille waifus -->
        <div class="waifu-grid" id="waifu-grid">
          <!-- Les cartes waifus seront ajoutées ici -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
